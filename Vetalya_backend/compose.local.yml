# One persistent PostgreSQL database for the shared web / Android / iOS backend.
# Start: docker compose --env-file ../config/local-stack.env -f compose.local.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: vetalya
      POSTGRES_USER: vetalya
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in config/local-stack.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetalya -d vetalya"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - vetalya-local-postgres:/var/lib/postgresql/data
volumes:
  vetalya-local-postgres:
