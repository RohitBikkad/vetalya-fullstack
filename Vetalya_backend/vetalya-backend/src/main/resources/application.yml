spring:
  application:
    name: Vetalya

  # ── PostgreSQL ──
  datasource:
    url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.evkdpnhbwajlmnpxeijb
    password: ${DB_PASSWORD:Vetalya@1409}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── OAuth2 Client (Google + Apple) ──
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          apple:
            client-id: ${APPLE_SERVICES_ID:apple-services-id-placeholder}
            # client-secret is generated dynamically — see AppleClientSecretGenerator
            client-secret: placeholder-replaced-at-runtime
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, name, email
            client-name: Apple

        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            issuer-uri: https://appleid.apple.com
            user-name-attribute: sub

# ── App-specific properties ──
app:
  # Web frontend redirect after OAuth login
  web-redirect-url: ${WEB_REDIRECT_URL:http://localhost:3000}
  # Mobile deep-link scheme
  mobile-redirect-scheme: ${MOBILE_REDIRECT_SCHEME:myvetapp}

  # JWT signing keys (RSA)
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 14

  # Google client IDs accepted for native token verification (web + Android + iOS)
  google:
    client-ids:
      - ${GOOGLE_CLIENT_ID:1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com}
      - ${GOOGLE_ANDROID_CLIENT_ID:}
      - ${GOOGLE_IOS_CLIENT_ID:}

  # Apple configuration
  apple:
    team-id: ${APPLE_TEAM_ID:apple-team-id-placeholder}
    key-id: ${APPLE_KEY_ID:apple-key-id-placeholder}
    services-id: ${APPLE_SERVICES_ID:apple-services-id-placeholder}
    bundle-id: ${APPLE_BUNDLE_ID:}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:classpath:keys/AuthKey.p8}

  # CORS
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

server:
  port: 8080

logging:
  file:
    name: target/spring-boot.log
  level:
    root: INFO
    com.pet.vetalya: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

