# ============================================================
# Render Blueprint Specification for Vetalya Fullstack Platform
# Deploy directly from Render Dashboard: New + -> Blueprint
# ============================================================

services:
  # ── 1. Vetalya Spring Boot Backend Web Service ──
  - type: web
    name: vetalya-backend
    runtime: docker
    dockerfilePath: ./Vetalya_backend/vetalya-backend/Dockerfile
    dockerContext: ./Vetalya_backend/vetalya-backend
    plan: free # Change to starter/standard for 24/7 dedicated compute
    region: singapore # Options: oregon, frankfurt, singapore, ohio
    healthCheckPath: /api/public/db-inspect
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.evkdpnhbwajlmnpxeijb
      - key: DB_PASSWORD
        value: Vetalya@1409
      - key: GOOGLE_CLIENT_ID
        value: 1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
      - key: WEB_REDIRECT_URL
        value: https://vetalya-frontend.onrender.com

      # ── Optional: Live SMTP Email Delivery (Gmail, SendGrid, Brevo, AWS SES) ──
      # Provide credentials to deliver real OTP emails to user inboxes
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # ── 2. Vetalya React Frontend Static Site ──
  - type: web
    name: vetalya-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: Vetalaya_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vetalya-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com
