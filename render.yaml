services:
  # ── Vetalya Spring Boot Backend ──
  - type: web
    name: vetalya-backend
    runtime: docker
    dockerfilePath: ./Vetalya_backend/vetalya-backend/Dockerfile
    dockerContext: ./Vetalya_backend/vetalya-backend
    plan: starter
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.evkdpnhbwajlmnpxeijb
      - key: DB_PASSWORD
        value: Vetalya@1409
      - key: GOOGLE_CLIENT_ID
        value: 1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
      - key: WEB_REDIRECT_URL
        value: https://vetalya-frontend.onrender.com
      # Optional SMTP Email Configuration
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # ── Vetalya React Frontend ──
  - type: web
    name: vetalya-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: Vetalaya_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vetalya-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com
