# ============================================================
# Render Blueprint Specification for Vetalya Fullstack Platform
# Deploy directly from Render Dashboard: New + -> Blueprint
# ============================================================

services:
  # ── 1. Vetalya Spring Boot Backend Web Service ──
  - type: web
    name: vetalya-backend
    runtime: docker
    dockerfilePath: ./Vetalya_backend/Dockerfile
    dockerContext: ./Vetalya_backend
    plan: starter
    region: singapore # Options: singapore, oregon, frankfurt, ohio
    healthCheckPath: /api/public/db-inspect
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      
      # ── Database Credentials (Set securely in Render Dashboard) ──
      - key: DB_URL
        value: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory&prepareThreshold=0
      - key: DB_USERNAME
        value: postgres.lihsmcgfxjuldjenjdti
      - key: DB_PASSWORD
        sync: false # Render dashboard will prompt you for this password securely

      # ── Google OAuth ──
      - key: GOOGLE_CLIENT_ID
        sync: false # Set in dashboard without committing to Git

      # ── Network & CORS ──
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
      - key: WEB_REDIRECT_URL
        value: https://vetalya-frontend.onrender.com

      # ── Live Email Delivery (Gmail / SendGrid / Brevo) ──
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

      # ── Brevo Transactional Email API (Bypasses Render SMTP port 587 block) ──
      - key: BREVO_API_KEY
        sync: false

      # ── Fast2SMS Mobile Phone OTP ──
      - key: FAST2SMS_API_KEY
        value: 5FWBTq1UHXEVQklkkBsMPSNRpNXgiJJYhifxeUrqriydM9YFMOx1JTHWwTrq7kA2mPgEUPoqLFkpcIbQ
      - key: FAST2SMS_ENABLED
        value: "true"

      # ── Meta WhatsApp Cloud API (Free 1,000 conversations/month) ──
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1500405019813304"
      - key: WHATSAPP_VERIFY_TOKEN
        value: "vetalya_whatsapp_secret"
      - key: WHATSAPP_ENABLED
        value: "true"

  # ── 2. Vetalya React Frontend Static Site ──
  - type: web
    name: vetalya-frontend
    runtime: static
    rootDir: Vetalaya_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # ── Frontend API & Google Client ID (Set in Render Dashboard) ──
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://vetalya-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # e.g. 1030204623930-gbcnm72iv1tm2vpbd4mg14k38pv0g3cr.apps.googleusercontent.com
